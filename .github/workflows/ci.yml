name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Token mặc định chỉ được đọc repo
permissions:
  contents: read

# Trên PR chỉ lần push mới nhất quan trọng; trên main mọi commit phải có kết quả đầy đủ
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Chỉ cần JDK: database là H2 trong bộ nhớ, không cần Docker (ADR-0013)
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Test bị bỏ qua không được tính là xanh (AC-001-14).
      # Cũng ghi bảng tổng chạy/fail/skipped vào job summary (AC-001-17).
      - name: Fail if any test was skipped
        run: bash .github/scripts/check-no-skipped-tests.sh

      - name: Upload JaCoCo report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
