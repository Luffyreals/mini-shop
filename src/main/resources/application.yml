spring:
  application:
    name: mini-shop
  main:
    # Ứng dụng desktop: không có máy chủ web (ADR-0014). Cửa sổ JavaFX do desktop.MiniShopApp mở sau khi Spring khởi động xong
    web-application-type: none
  jpa:
    hibernate:
      # Flyway quản lý schema; Hibernate chỉ kiểm tra entity khớp với bảng (ADR-0004)
      ddl-auto: validate
  datasource:
    # H2 nhúng, lưu ra file data/minishop.mv.db (tương đối với thư mục chạy app, đã nằm trong .gitignore); tắt app mở lại vẫn còn dữ liệu.
    # Chế độ tương thích PostgreSQL để V1/V2 và các truy vấn chạy y như trước, xem ADR-0013
    url: jdbc:h2:file:${app.data-dir}/minishop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    hikari:
      # Mọi câu chờ khóa dòng chỉ chờ tối đa 5 giây rồi rollback và báo lỗi (thay vì treo vô hạn); cú pháp H2, đơn vị ms, xem ADR-0012
      connection-init-sql: "SET LOCK_TIMEOUT 5000"

logging:
  level:
    # Hibernate tự log lỗi JDBC ở mức ERROR, kể cả ca đã xử lý êm; tắt để mỗi lỗi chỉ một dòng ERROR do lớp xử lý lỗi của ứng dụng ghi, xem ADR-0011
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: off
    # Hibernate 7 ghi cùng thông báo ở mức WARN qua logger này; thông báo vi phạm UNIQUE của H2 kèm giá trị dòng (email...), nên tắt, xem ADR-0013
    org.hibernate.orm.jdbc.error: off

app:
  # Thư mục dữ liệu (database H2 và ảnh upload). Đường dẫn tương đối như data2 được DataDirectory đổi thành ./data2
  # vì H2 không nhận đường dẫn tương đối ngầm, xem ADR-0013
  data-dir: ${DATA_DIR:./data}
  seed:
    # Mật khẩu demo chỉ dùng để học và trình diễn (BR-001-2)
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    user-password: ${SEED_USER_PASSWORD:User@123}
  storage:
    local:
      # Cạnh file database trong data/ (đã nằm trong .gitignore): xóa một thư mục là làm lại từ đầu, xem ADR-0013
      upload-dir: ${UPLOAD_DIR:${app.data-dir}/uploads}
