spring:
  application:
    name: mini-shop
  jpa:
    # Buộc service phải load đủ dữ liệu trong transaction, lộ sớm lỗi N+1 / lazy loading
    open-in-view: false
    hibernate:
      # Flyway quản lý schema; Hibernate chỉ kiểm tra entity khớp với bảng (ADR-0004)
      ddl-auto: validate
  servlet:
    multipart:
      # Trần của Tomcat; giới hạn ảnh 2 MB kiểm trong ứng dụng (ImageUpload) để hiện lỗi trên form thay vì 403/ngắt kết nối, xem ADR-0010
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    # Boot 4: thay cho server.error.*. Đặt tường minh để mọi profile (kể cả dev) đều không đổi được mặc định; trang lỗi không bao giờ lộ chi tiết (BR-007-2), xem ADR-0011
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
      # Boot 4.1 mặc định là always và phản chiếu lại đường dẫn người dùng gửi lên trong thân JSON; tắt hẳn (BR-007-2), xem ADR-0011
      include-path: never
  h2:
    console:
      # Chỉ mở cho trình duyệt trên chính máy này (Boot mặc định web-allow-others=false); profile public tắt hẳn, xem ADR-0013
      enabled: true
      path: /h2-console
  datasource:
    # H2 nhúng, lưu ra file data/minishop.mv.db (tương đối với thư mục chạy app, đã nằm trong .gitignore); tắt app mở lại vẫn còn dữ liệu.
    # Chế độ tương thích PostgreSQL để V1/V2 và các truy vấn chạy y như trước, xem ADR-0013
    url: jdbc:h2:file:${DATA_DIR:./data}/minishop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    hikari:
      # Mọi câu chờ khóa dòng chỉ chờ tối đa 5 giây rồi rollback và hiện trang 500 (thay vì treo vô hạn); cú pháp H2, đơn vị ms, xem ADR-0012
      connection-init-sql: "SET LOCK_TIMEOUT 5000"

server:
  # Dùng RemoteIpValve của Tomcat (chỉ tin proxy trong internal-proxies) thay vì ForwardedHeaderFilter (tin mọi kết nối); để chuyển hướng dùng https và IP thật qua tunnel, xem ADR-0012
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        # Ghi tường minh cho mọi profile (trình duyệt vốn mặc định Lax); Secure chỉ đặt ở profile public để HTTP thường trong dev/test vẫn giữ được cookie, xem ADR-0012
        same-site: lax
  tomcat:
    remoteip:
      # Chỉ tin header X-Forwarded-* khi kết nối đến từ chính máy này (cloudflared chạy trên máy); mặc định của Boot còn tin cả dải LAN, xem ADR-0012
      internal-proxies: "127.0.0.0/8, ::1/128"
      # Boot không có giá trị mặc định cho hai header này; không đặt thì RemoteIpValve không đọc IP và giao thức thật, xem ADR-0012
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      # Boot mặc định còn đọc X-Forwarded-Host và X-Forwarded-Port; cloudflared đã chuyển đúng Host, còn hai header này do client tự gửi được. Rỗng = Tomcat không đọc (header tên rỗng không tồn tại), xem ADR-0012
      host-header: ""
      port-header: ""
    # Đọc bỏ phần thân tới 50 MB (mặc định 2 MB thì Tomcat đóng kết nối) để trả được trang 413 thay vì "connection reset"; trên 50 MB vẫn ngắt, xem ADR-0011
    max-swallow-size: 50MB

logging:
  level:
    # Hibernate tự log lỗi JDBC ở mức ERROR, kể cả ca đã xử lý êm; tắt để mỗi lỗi chỉ một dòng ERROR (UnhandledExceptionResolver), xem ADR-0011
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: off
    # Hibernate 7 ghi cùng thông báo ở mức WARN qua logger này; thông báo vi phạm UNIQUE của H2 kèm giá trị dòng (email...), nên tắt, xem ADR-0013
    org.hibernate.orm.jdbc.error: off

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        # Không có /actuator/health/liveness và /readiness; /actuator/health chỉ trả {"status":"UP"} xem ADR-0012
        enabled: false

app:
  seed:
    # Mật khẩu demo chỉ dùng cho dev (BR-001-2); môi trường thật phải đặt biến môi trường
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@123}
    user-password: ${SEED_USER_PASSWORD:User@123}
  storage:
    local:
      # Cạnh file database trong data/ (đã nằm trong .gitignore): xóa một thư mục là làm lại từ đầu, xem ADR-0013
      upload-dir: ${UPLOAD_DIR:${DATA_DIR:./data}/uploads}
