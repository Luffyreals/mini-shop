spring:
  application:
    name: mini-shop
  jpa:
    # Buộc service phải load đủ dữ liệu trong transaction, lộ sớm lỗi N+1 / lazy loading
    open-in-view: false
    hibernate:
      # Flyway quản lý schema; Hibernate chỉ kiểm tra entity khớp với bảng (ADR-0004)
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
