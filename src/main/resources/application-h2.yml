# Profile dự phòng cho máy không có Docker: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# H2 chạy trong bộ nhớ ở chế độ tương thích PostgreSQL; dữ liệu mất khi tắt app.
spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:minishop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    hikari:
      # Cú pháp H2 (đơn vị ms) cho cùng giới hạn 5 giây của application.yml; câu của PostgreSQL không chạy được trên H2, xem ADR-0012
      connection-init-sql: "SET LOCK_TIMEOUT 5000"
  h2:
    console:
      # Chỉ profile này bật H2 console (application.yml tắt ở mọi profile khác), xem ADR-0012
      enabled: true
      path: /h2-console
