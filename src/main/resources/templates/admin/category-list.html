<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Danh sách danh mục. Model: categories (List<CategoryRow>: id, name, description, productCount); flash tùy chọn: notice, noticeKind.
  POST /admin/categories/{id}/delete không có field. Hộp xác nhận qua data-confirm (static/js/confirm.js).
-->
<head th:replace="~{fragments/admin :: head('Danh mục | Quản trị Mini Shop')}"></head>
<body class="admin-body">
<div class="admin-shell">
  <aside th:replace="~{fragments/admin :: sidebar('categories')}"></aside>

  <main class="admin-main">
    <div class="admin-pagehead">
      <h1 class="admin-title">Danh mục</h1>
      <a class="btn btn-primary" th:href="@{/admin/categories/new}">Thêm danh mục</a>
    </div>

    <th:block th:if="${notice != null}">
      <div th:replace="~{fragments/notice :: notice(${noticeKind}, ${notice})}"></div>
    </th:block>

    <section class="admin-card" aria-labelledby="categories-title">
      <h2 class="visually-hidden" id="categories-title">Danh sách danh mục</h2>

      <p class="admin-empty" th:if="${#lists.isEmpty(categories)}">Chưa có danh mục nào.</p>

      <div class="admin-table-wrap" th:unless="${#lists.isEmpty(categories)}"
           role="region" aria-labelledby="categories-title" tabindex="0">
        <table class="admin-table" aria-labelledby="categories-title">
          <thead>
            <tr>
              <th scope="col">Tên</th>
              <th scope="col">Mô tả</th>
              <th scope="col" class="admin-num">Số sản phẩm</th>
              <th scope="col"><span class="visually-hidden">Thao tác</span></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${categories}">
              <td class="admin-strong" th:text="${c.name}">Tên danh mục</td>
              <td class="admin-multiline admin-desc" th:text="${c.description}">Mô tả</td>
              <td class="admin-num" th:text="${c.productCount}">0</td>
              <td>
                <div class="admin-actions admin-actions--row">
                  <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/categories/{id}/edit(id=${c.id})}">Sửa</a>
                  <form method="post" th:action="@{/admin/categories/{id}/delete(id=${c.id})}"
                        th:data-confirm="${'Xóa danh mục ' + c.name + '? Không thể hoàn tác.'}">
                    <button class="btn btn-outline-danger btn-sm" type="submit">Xóa</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script th:src="@{/js/confirm.js}" defer></script>
</body>
</html>
