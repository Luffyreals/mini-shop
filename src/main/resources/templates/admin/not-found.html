<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--/*
  404 trong layout quản trị (AC-006-5). Model: notFoundTitle, backUrl, backLabel, section (dashboard | orders | products | categories).
  Controller trả HTTP 404; tiêu đề tab nối chuỗi trong biểu thức, không dùng literal |...|.
*/-->
<head th:replace="~{fragments/admin :: head(${notFoundTitle + ' | Quản trị Mini Shop'})}"></head>
<body class="admin-body">
<a th:replace="~{fragments/layout :: skipLink}"></a>
<div class="admin-shell">
  <aside th:replace="~{fragments/admin :: sidebar(${section})}"></aside>

  <main id="main" tabindex="-1" class="admin-main">
    <div class="admin-pagehead">
      <h1 class="admin-title" th:text="${notFoundTitle}">Không tìm thấy trang</h1>
    </div>
    <section class="admin-card admin-card--narrow">
      <p class="admin-empty">Mục này không tồn tại hoặc đã bị xóa.</p>
      <a class="btn btn-primary" th:href="@{${backUrl}}" th:text="${backLabel}">Quay lại danh sách</a>
    </section>
  </main>
</div>
</body>
</html>
