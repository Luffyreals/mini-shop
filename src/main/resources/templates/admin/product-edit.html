<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Form sửa sản phẩm (multipart) + điều chỉnh tồn kho + ẩn/hiện.
  Model: product (ProductEditView: id, name, categoryId, price, description, stock, active, imageUrl),
         form (EditProductForm), categories (List<CategoryOption>); flash tùy chọn: notice, noticeKind.
  POST /admin/products/{id} (multipart). Field: name, categoryId, price, description, image (file). Không có tồn kho, không có active.
  POST /admin/products/{id}/stock. Field: delta.
  POST /admin/products/{id}/hide | /show. Field: from=edit.
-->
<head th:replace="~{fragments/admin :: head('Sửa sản phẩm | Quản trị Mini Shop')}"></head>
<body class="admin-body">
<div class="admin-shell">
  <aside th:replace="~{fragments/admin :: sidebar('products')}"></aside>

  <main class="admin-main">
    <div class="admin-pagehead">
      <h1 class="admin-title">Sửa sản phẩm</h1>
      <div class="admin-actions">
        <span class="admin-flag" th:classappend="${product.active} ? 'admin-flag--on' : 'admin-flag--off'"
              th:text="${product.active} ? 'Đang bán' : 'Đã ẩn'">Đang bán</span>
        <a class="btn btn-outline-dark" th:if="${product.active}" th:href="@{/products/{id}(id=${product.id})}">Xem trên cửa hàng</a>
        <form method="post" th:if="${product.active}" th:action="@{/admin/products/{id}/hide(id=${product.id})}">
          <input type="hidden" name="from" value="edit">
          <button class="btn btn-outline-dark" type="submit">Ẩn</button>
        </form>
        <form method="post" th:unless="${product.active}" th:action="@{/admin/products/{id}/show(id=${product.id})}">
          <input type="hidden" name="from" value="edit">
          <button class="btn btn-outline-dark" type="submit">Hiện lại</button>
        </form>
      </div>
    </div>

    <th:block th:if="${notice != null}">
      <div th:replace="~{fragments/notice :: notice(${noticeKind}, ${notice})}"></div>
    </th:block>

    <div class="admin-split">
      <section class="admin-card admin-card--form">
        <form class="admin-form" method="post" enctype="multipart/form-data" novalidate
              th:action="@{/admin/products/{id}(id=${product.id})}" th:object="${form}">
          <div class="admin-field">
            <label class="form-label" for="name">Tên sản phẩm</label>
            <input class="form-control" type="text" maxlength="200" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   th:aria-invalid="${#fields.hasErrors('name')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('name')} ? 'name-error'">
            <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Lỗi</p>
          </div>

          <div class="admin-field">
            <label class="form-label" for="categoryId">Danh mục</label>
            <select class="form-select" th:field="*{categoryId}"
                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'"
                    th:aria-invalid="${#fields.hasErrors('categoryId')} ? 'true'"
                    th:aria-describedby="${#fields.hasErrors('categoryId')} ? 'categoryId-error'">
              <option value="">Chọn danh mục</option>
              <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Danh mục</option>
            </select>
            <p class="field-error" id="categoryId-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Lỗi</p>
          </div>

          <div class="admin-field">
            <label class="form-label" for="price">Giá (₫)</label>
            <input class="form-control" type="text" inputmode="numeric" autocomplete="off" th:field="*{price}"
                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                   th:aria-invalid="${#fields.hasErrors('price')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('price')} ? 'price-error'">
            <p class="field-error" id="price-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Lỗi</p>
          </div>

          <div class="admin-field">
            <label class="form-label" for="description">Mô tả (không bắt buộc)</label>
            <textarea class="form-control" rows="5" maxlength="4000" th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                      th:aria-invalid="${#fields.hasErrors('description')} ? 'true'"
                      th:aria-describedby="${#fields.hasErrors('description')} ? 'description-error'"></textarea>
            <p class="field-error" id="description-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Lỗi</p>
          </div>

          <div class="admin-field">
            <span class="form-label" id="current-image-label">Ảnh hiện tại</span>
            <img class="admin-thumb admin-thumb--lg" th:if="${product.imageUrl != null}" th:src="@{${product.imageUrl}}"
                 th:alt="${product.name}" alt="Ảnh sản phẩm" width="96" height="120">
            <span class="admin-thumb admin-thumb--lg admin-thumb--empty" th:unless="${product.imageUrl != null}">
              <span class="visually-hidden">Chưa có ảnh</span>
            </span>
          </div>

          <div class="admin-field">
            <label class="form-label" for="image">Ảnh mới (không bắt buộc)</label>
            <input class="form-control" type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp"
                   th:classappend="${#fields.hasErrors('image')} ? 'is-invalid'"
                   th:aria-invalid="${#fields.hasErrors('image')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('image')} ? 'image-hint image-error' : 'image-hint'">
            <p class="admin-hint" id="image-hint">JPG, PNG hoặc WebP, tối đa 2 MB.</p>
            <p class="field-error" id="image-error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}">Lỗi</p>
          </div>

          <div class="admin-actions">
            <button class="btn btn-primary" type="submit">Lưu</button>
            <a class="btn btn-outline-dark" th:href="@{/admin/products}">Hủy</a>
          </div>
        </form>
      </section>

      <section class="admin-card admin-card--stock" aria-labelledby="stock-title">
        <h2 class="admin-card__title" id="stock-title">Điều chỉnh tồn kho</h2>
        <p class="admin-stockline" th:text="|Tồn kho hiện tại: ${product.stock}|">Tồn kho hiện tại: 10</p>
        <form method="post" novalidate th:action="@{/admin/products/{id}/stock(id=${product.id})}">
          <div class="admin-field">
            <label class="form-label" for="delta">Số lượng thay đổi</label>
            <input class="form-control" type="text" id="delta" name="delta" inputmode="numeric" autocomplete="off"
                   aria-describedby="delta-hint">
            <p class="admin-hint" id="delta-hint">Số dương để nhập thêm, số âm để giảm (ví dụ: 20 hoặc -3).</p>
          </div>
          <button class="btn btn-primary" type="submit">Cập nhật tồn kho</button>
        </form>
      </section>
    </div>
  </main>
</div>
</body>
</html>
