<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Form thêm sản phẩm (multipart). Model: form (NewProductForm), categories (List<CategoryOption>: id, name).
  POST /admin/products (multipart/form-data). Field: name, categoryId, price, initialStock, description, active (checkbox, value=true), image (file).
  Không có danh mục nào: không hiện form, chỉ lời nhắn và link tạo danh mục.
-->
<head th:replace="~{fragments/admin :: head('Thêm sản phẩm | Quản trị Mini Shop')}"></head>
<body class="admin-body">
<div class="admin-shell">
  <aside th:replace="~{fragments/admin :: sidebar('products')}"></aside>

  <main class="admin-main">
    <div class="admin-pagehead">
      <h1 class="admin-title">Thêm sản phẩm</h1>
    </div>

    <section class="admin-card admin-card--narrow" th:if="${#lists.isEmpty(categories)}">
      <p class="admin-empty">Cần tạo danh mục trước khi thêm sản phẩm.</p>
      <a class="btn btn-primary" th:href="@{/admin/categories/new}">Thêm danh mục</a>
    </section>

    <section class="admin-card admin-card--form" th:unless="${#lists.isEmpty(categories)}">
      <form class="admin-form" method="post" enctype="multipart/form-data" novalidate
            th:action="@{/admin/products}" th:object="${form}">
        <div class="admin-field">
          <label class="form-label" for="name">Tên sản phẩm</label>
          <input class="form-control" type="text" maxlength="200" th:field="*{name}"
                 th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                 th:aria-invalid="${#fields.hasErrors('name')} ? 'true'"
                 th:aria-describedby="${#fields.hasErrors('name')} ? 'name-error'">
          <p class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Lỗi</p>
        </div>

        <div class="admin-field">
          <label class="form-label" for="categoryId">Danh mục</label>
          <select class="form-select" th:field="*{categoryId}"
                  th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid'"
                  th:aria-invalid="${#fields.hasErrors('categoryId')} ? 'true'"
                  th:aria-describedby="${#fields.hasErrors('categoryId')} ? 'categoryId-error'">
            <option value="">Chọn danh mục</option>
            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Danh mục</option>
          </select>
          <p class="field-error" id="categoryId-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">Lỗi</p>
        </div>

        <div class="admin-field-row">
          <div class="admin-field">
            <label class="form-label" for="price">Giá (₫)</label>
            <input class="form-control" type="text" inputmode="numeric" autocomplete="off" th:field="*{price}"
                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                   th:aria-invalid="${#fields.hasErrors('price')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('price')} ? 'price-error'">
            <p class="field-error" id="price-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Lỗi</p>
          </div>

          <div class="admin-field">
            <label class="form-label" for="initialStock">Tồn kho ban đầu</label>
            <input class="form-control" type="text" inputmode="numeric" autocomplete="off" th:field="*{initialStock}"
                   th:classappend="${#fields.hasErrors('initialStock')} ? 'is-invalid'"
                   th:aria-invalid="${#fields.hasErrors('initialStock')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('initialStock')} ? 'initialStock-error'">
            <p class="field-error" id="initialStock-error" th:if="${#fields.hasErrors('initialStock')}" th:errors="*{initialStock}">Lỗi</p>
          </div>
        </div>

        <div class="admin-field">
          <label class="form-label" for="description">Mô tả (không bắt buộc)</label>
          <textarea class="form-control" rows="5" maxlength="4000" th:field="*{description}"
                    th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                    th:aria-invalid="${#fields.hasErrors('description')} ? 'true'"
                    th:aria-describedby="${#fields.hasErrors('description')} ? 'description-error'"></textarea>
          <p class="field-error" id="description-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Lỗi</p>
        </div>

        <div class="admin-field">
          <label class="form-label" for="image">Ảnh sản phẩm</label>
          <input class="form-control" type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp"
                 th:classappend="${#fields.hasErrors('image')} ? 'is-invalid'"
                 th:aria-invalid="${#fields.hasErrors('image')} ? 'true'"
                 th:aria-describedby="${#fields.hasErrors('image')} ? 'image-hint image-error' : 'image-hint'">
          <p class="admin-hint" id="image-hint">JPG, PNG hoặc WebP, tối đa 2 MB.</p>
          <p class="field-error" id="image-error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}">Lỗi</p>
        </div>

        <div class="admin-field admin-check">
          <input class="form-check-input" type="checkbox" id="active" name="active" value="true"
                 th:checked="${form.active}">
          <label class="form-check-label" for="active">Đang bán</label>
        </div>

        <div class="admin-actions">
          <button class="btn btn-primary" type="submit">Lưu</button>
          <a class="btn btn-outline-dark" th:href="@{/admin/products}">Hủy</a>
        </div>
      </form>
    </section>
  </main>
</div>
</body>
</html>
