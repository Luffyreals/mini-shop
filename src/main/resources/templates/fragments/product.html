<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Ô ảnh "mẫu vật": ô màu phẳng cố định tỉ lệ, ảnh object-fit: cover.
  Màu ô lấy theo id sản phẩm nên một sản phẩm luôn cùng một màu ở danh sách và chi tiết.
  src là null thì dùng ảnh thay thế; alt luôn là tên sản phẩm (AC-002-16).
*/-->
<div th:fragment="tile(productId, src, alt, lazy)"
     th:with="tone=${(productId + productId / 4) % 4 + 1}"
     th:classappend="'tile-field-' + ${tone}"
     class="product-tile">
  <img class="product-tile__img" width="800" height="1000"
       th:src="@{${src != null ? src : '/images/placeholder-product.svg'}}"
       th:alt="${alt}"
       th:attr="loading=${lazy} ? 'lazy' : 'eager'">
</div>

<!--/* Nhãn kho: luôn có chữ. showInStock=false ở danh sách: chỉ hiện "Hết hàng". */-->
<th:block th:fragment="stock(inStock, showInStock)">
  <span class="badge stock-badge stock-badge--out" th:if="${!inStock}">Hết hàng</span>
  <span class="badge stock-badge stock-badge--in" th:if="${inStock and showInStock}">Còn hàng</span>
</th:block>

<!--/* Thẻ sản phẩm ở danh sách: ô ảnh, rồi tên, danh mục và giá canh trái theo mép ô. */-->
<article th:fragment="card(p, lazy)" class="product-card" th:classappend="${!p.inStock} ? 'is-out-of-stock'">
  <div th:replace="~{fragments/product :: tile(${p.id}, ${p.imageUrl}, ${p.name}, ${lazy})}"></div>
  <h2 class="product-card__name">
    <a class="stretched-link" th:href="@{/products/{id}(id=${p.id})}" th:text="${p.name}">Tên sản phẩm</a>
  </h2>
  <p class="product-card__meta" th:text="${p.categoryName}">Danh mục</p>
  <p class="product-card__foot">
    <span class="price" th:text="${#vnd.format(p.price)}">1.250.000 ₫</span>
    <th:block th:replace="~{fragments/product :: stock(${p.inStock}, false)}"></th:block>
  </p>
</article>
</body>
</html>
