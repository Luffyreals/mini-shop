<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Thông báo một lần, do server render (không cần JS).
  kind: success | error | info. error dùng role="alert", hai loại còn lại dùng role="status".
  Chữ luôn qua th:text (escape).
-->
<body>
<div th:fragment="notice(kind, text)" class="notice" th:classappend="|notice--${kind}|"
     th:attr="role=${kind == 'error' ? 'alert' : 'status'}" th:text="${text}">Thông báo</div>
</body>
</html>
