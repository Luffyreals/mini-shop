<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name + ' | Mini Shop'})}"></head>
<body class="site-body">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="ms-container site-main">
  <div class="notice-bar" th:if="${notice != null}">
    <div th:replace="~{fragments/notice :: notice(${noticeKind}, ${notice})}"></div>
    <a class="notice-bar__link" th:if="${showCartLink != null and showCartLink}" th:href="@{/cart}">Xem giỏ hàng</a>
  </div>
  <div class="row g-4 g-lg-5">
    <div class="col-12 col-md-6">
      <div th:replace="~{fragments/product :: tile(${product.id}, ${product.imageUrl}, ${product.name}, false)}"></div>
    </div>
    <div class="col-12 col-md-6 product-detail">
      <h1 class="product-detail__title" th:text="${product.name}">Tên sản phẩm</h1>
      <p class="product-detail__category" th:text="${product.categoryName}">Danh mục</p>
      <p class="product-detail__price">
        <span class="price" th:text="${#vnd.format(product.price)}">1.250.000 ₫</span>
      </p>
      <p class="mb-4">
        <th:block th:replace="~{fragments/product :: stock(${product.inStock}, true)}"></th:block>
      </p>
      <p class="product-description" th:if="${!#strings.isEmpty(product.description)}"
         th:text="${product.description}">Mô tả sản phẩm</p>
      <form class="add-to-cart" th:if="${product.inStock}" method="post" th:action="@{/cart/items}" novalidate>
        <input type="hidden" name="productId" th:value="${product.id}">
        <div class="add-to-cart__field">
          <label class="form-label" for="quantity">Số lượng</label>
          <input class="form-control" id="quantity" name="quantity" type="number" min="1" max="99" step="1"
                 value="1" inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary">Thêm vào giỏ</button>
      </form>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
