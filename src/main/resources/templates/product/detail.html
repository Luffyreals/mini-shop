<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name + ' | Mini Shop'})}"></head>
<body class="site-body">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="ms-container site-main">
  <div class="row g-4 g-lg-5">
    <div class="col-12 col-md-6">
      <div th:replace="~{fragments/product :: tile(${product.id}, ${product.imageUrl}, ${product.name}, false)}"></div>
    </div>
    <div class="col-12 col-md-6 product-detail">
      <h1 class="product-detail__title" th:text="${product.name}">Tên sản phẩm</h1>
      <p class="product-detail__category" th:text="${product.categoryName}">Danh mục</p>
      <p class="product-detail__price">
        <span class="price" th:text="${#vnd.format(product.price)}">1.250.000 ₫</span>
      </p>
      <p class="mb-4">
        <th:block th:replace="~{fragments/product :: stock(${product.inStock}, true)}"></th:block>
      </p>
      <p class="product-description" th:if="${!#strings.isEmpty(product.description)}"
         th:text="${product.description}">Mô tả sản phẩm</p>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
