<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sản phẩm | Mini Shop')}"></head>
<body class="site-body">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="ms-container site-main">
  <h1 class="page-title page-title--masthead">Sản phẩm</h1>

  <!-- Form GET: không gửi page, nên đổi bộ lọc thì về trang 1; không cần CSRF -->
  <form class="filter-panel" method="get" th:action="@{/products}">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-6 col-lg-4">
        <label class="visually-hidden" for="filter-q">Tìm sản phẩm theo tên</label>
        <input class="form-control" type="search" id="filter-q" name="q" maxlength="100"
               placeholder="Tìm sản phẩm theo tên…" th:value="${view.filter.q}">
      </div>
      <div class="col-12 col-sm-6 col-md-3 col-lg-3">
        <label class="form-label" for="filter-category">Danh mục</label>
        <select class="form-select" id="filter-category" name="category">
          <option value="" th:selected="${view.filter.categoryId == null}">Tất cả danh mục</option>
          <option th:each="c : ${view.categories}" th:value="${c.id}" th:text="${c.name}"
                  th:selected="${view.filter.categoryId != null and view.filter.categoryId == c.id}">Danh mục</option>
        </select>
      </div>
      <div class="col-12 col-sm-6 col-md-3 col-lg-3">
        <label class="form-label" for="filter-sort">Sắp xếp</label>
        <select class="form-select" id="filter-sort" name="sort">
          <option value="newest" th:selected="${view.filter.sort.name() == 'NEWEST'}">Mới nhất</option>
          <option value="price_asc" th:selected="${view.filter.sort.name() == 'PRICE_ASC'}">Giá: thấp đến cao</option>
          <option value="price_desc" th:selected="${view.filter.sort.name() == 'PRICE_DESC'}">Giá: cao đến thấp</option>
        </select>
      </div>
      <div class="col-12 col-lg-2">
        <button class="btn btn-primary w-100" type="submit">Tìm</button>
      </div>
    </div>
  </form>

  <p class="result-count" th:text="|Tìm thấy ${view.totalElements} sản phẩm|">Tìm thấy 0 sản phẩm</p>

  <div class="product-grid row row-cols-2 row-cols-md-3 row-cols-xl-4" th:if="${!#lists.isEmpty(view.products)}">
    <div class="col" th:each="p, st : ${view.products}">
      <article th:replace="~{fragments/product :: card(${p}, ${st.index >= 4})}"></article>
    </div>
  </div>

  <div class="empty-state" th:if="${#lists.isEmpty(view.products)}">
    <p class="empty-state__text">Không tìm thấy sản phẩm phù hợp.</p>
    <a class="btn btn-outline-dark" th:href="@{/products}">Xóa bộ lọc</a>
  </div>

  <div class="pagination-wrap" th:if="${!#lists.isEmpty(view.products)}">
    <nav th:replace="~{fragments/pagination :: pagination(${pageNav})}"></nav>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
